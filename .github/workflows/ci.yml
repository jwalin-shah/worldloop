name: worldloop-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync hackathon stack
        run: uv sync --extra dev --extra sponsors
      - name: Preflight
        run: ./scripts/preflight.sh
      - name: Unit tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: End-to-end smoke
        run: ./scripts/smoke.sh
