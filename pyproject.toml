[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldloop"
version = "0.1.0"
description = "Self-improving context compiler for CoreWeave Hacks: Agent Loops"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8"]
sponsors = ["weave", "cwsandbox", "marimo", "typesafe-sdk"]

[project.scripts]
worldloop = "worldloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worldloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"notebooks/worldloop_lab.py" = ["I001", "B018"]
"scripts/run_three_arm_eval.py" = ["F401", "F541", "BLE001", "RUF010"]
"src/worldloop/typesafe_router.py" = ["SIM102"]
"src/worldloop/wandb_inference.py" = ["I001", "F401", "F841"]
"tests/test_provider_readiness.py" = ["I001"]
"tests/test_typesafe_router.py" = ["I001"]
"tests/test_wandb_inference.py" = ["I001", "F401"]
